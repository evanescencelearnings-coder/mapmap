name: macOS DMG

on:
  push:
    branches: [mac-dmg]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        run: |
          brew install qt
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"

      - name: Build
        run: |
          qmake mapmap.pro CONFIG+=release CONFIG-=debug
          make -j"$(sysctl -n hw.logicalcpu)"
          APP="$(find . -maxdepth 1 -iname '*.app' | head -1)"
          mv "$APP" MapMap.app.tmp && mv MapMap.app.tmp MapMap.app

      - name: Bundle Qt and sign (ad-hoc)
        run: |
          LIBPATHS=""
          for d in "$(brew --prefix)"/opt/qt*/lib; do LIBPATHS="$LIBPATHS -libpath=$d"; done
          macdeployqt MapMap.app $LIBPATHS || true
          # Vendored Syphon.framework ships without an Info.plist, which codesign rejects.
          SY=MapMap.app/Contents/Frameworks/Syphon.framework
          ls -la "$SY" "$SY/Versions" || true
          mkdir -p "$SY/Versions/A/Resources"
          [ -f "$SY/Versions/A/Resources/Info.plist" ] || cat > "$SY/Versions/A/Resources/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>Syphon</string>
            <key>CFBundleIdentifier</key><string>info.v002.Syphon</string>
            <key>CFBundleName</key><string>Syphon</string>
            <key>CFBundlePackageType</key><string>FMWK</string>
            <key>CFBundleShortVersionString</key><string>5</string>
            <key>CFBundleVersion</key><string>5</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
          </dict></plist>
          EOF
          # Sign inside-out: every framework and dylib, then the app itself.
          find MapMap.app/Contents -name "*.dylib" -exec codesign --force --sign - {} \;
          for f in MapMap.app/Contents/Frameworks/*.framework; do codesign --force --sign - "$f"; done
          codesign --force --sign - MapMap.app
          codesign --verify --deep --strict --verbose=2 MapMap.app
          otool -L MapMap.app/Contents/MacOS/* | grep -E "homebrew|/usr/local" && { echo "Still linked to Homebrew paths"; exit 1; } || true
          QT_QPA_PLATFORM=offscreen ./MapMap.app/Contents/MacOS/mapmap --version || true

      - name: Make DMG
        run: |
          VER="$(cat VERSION.txt)"
          DMG="MapMap-${VER}-macOS-${{ matrix.arch }}.dmg"
          mkdir dmgroot
          cp -R MapMap.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname MapMap -srcfolder dmgroot -ov -format UDZO "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"
          ls -lh "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DMG }}
          path: ${{ env.DMG }}

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="mac-dmg-build"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
              --title "MapMap macOS DMG" \
              --notes "Unsigned macOS build of MapMap. Source: https://github.com/mapmapteam/mapmap" || true
          gh release upload "$TAG" "$DMG" --clobber
